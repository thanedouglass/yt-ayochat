  <path d="M 610 660 L 786 690" stroke="#4ad98a" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 786 760 L 610 700" stroke="#4ad98a" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="626" y="652" fill="#7fe6ac" font-size="10.5">similarity query</text>
  <text x="626" y="744" fill="#7fe6ac" font-size="10.5">retrieved lore + memories</text>

  <!-- ======== telemetry taps (dotted) ======== -->
  <path d="M 610 726 L 700 726 L 700 990 L 776 990" stroke="#d9a94a" stroke-width="1.3" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M 610 866 L 700 866" stroke="#d9a94a" stroke-width="1.3" stroke-dasharray="5 5" fill="none"/>
  <path d="M 610 1026 L 700 1026" stroke="#d9a94a" stroke-width="1.3" stroke-dasharray="5 5" fill="none"/>
  <text x="712" y="884" fill="#ecc57e" font-size="10.5">trace events</text>

  <!-- TEL -> EVAL -->
  <line x1="970" y1="1064" x2="970" y2="1092" stroke="#d9a94a" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrowAmber)"/>
  <text x="982" y="1084" fill="#ecc57e" font-size="10.5">structured traces</text>

  <!-- EVAL feedback -> N2 -->
  <path d="M 780 1142 L 660 1142 L 660 846 L 614 846" stroke="#d9a94a" stroke-width="1.3" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="672" y="1000" fill="#ecc57e" font-size="10.5" transform="rotate(-90 672 1000)">quality &amp; security gates</text>

  <!-- ======== legend ======== -->
  <g font-size="10.5" fill="#8b94a7">
    <line x1="170" y1="1266" x2="210" y2="1266" stroke="#8b94a7" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="220" y="1270">primary data flow</text>
    <line x1="380" y1="1266" x2="420" y2="1266" stroke="#d9a94a" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrowAmber)"/>
    <text x="430" y="1270">observability / eval feedback</text>
    <line x1="660" y1="1266" x2="700" y2="1266" stroke="#4ad98a" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
    <text x="710" y="1270">vector retrieval</text>
    <line x1="870" y1="1266" x2="910" y2="1266" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="920" y="1270">response dispatch</text>
    <text x="170" y="1304" fill="#5b6372">yt-ayochat · lumi-swarm-v2 · devpost submission asset</text>
