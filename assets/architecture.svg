  <!-- Armor -> N1 -->
  <path d="M 500 464 L 500 512 L 400 512 L 400 622" stroke="#8b94a7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="412" y="548" fill="#8b94a7" font-size="10.5">sanitized · screened input</text>

  <!-- N1 -> N2 -->
  <line x1="400" y1="746" x2="400" y2="782" stroke="#c3a3ef" stroke-width="1.5" marker-end="url(#arrow)"/>
