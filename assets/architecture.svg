  <text x="980" y="818" text-anchor="middle" fill="#e8ecf4" font-size="12" font-weight="600">Sanitized Synthetic Memory Corpus</text>
  <text x="980" y="838" text-anchor="middle" fill="#7fe6ac" font-size="10.5">lumi_synthetic_memory.jsonl</text>

