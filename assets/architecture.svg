  <text x="970" y="1028" text-anchor="middle" fill="#ecc57e" font-size="10.5">src/telemetry/logger.py</text>

  <rect x="780" y="1096" width="380" height="92" rx="8" fill="#2b2210" stroke="#d9a94a" stroke-width="1.2"/>
  <text x="970" y="1126" text-anchor="middle" fill="#e8ecf4" font-size="12" font-weight="600">DeepEval Quality &amp; Security Pipeline</text>
  <text x="970" y="1148" text-anchor="middle" fill="#ecc57e" font-size="10.5">src/eval/</text>

