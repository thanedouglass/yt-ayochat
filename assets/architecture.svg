  <text x="210" y="678" fill="#e8ecf4" font-size="11.5">Ingests comment text · tokenizes · vector</text>
  <text x="210" y="696" fill="#e8ecf4" font-size="11.5">similarity search against dual memory stores</text>
  <text x="210" y="722" fill="#9a8bbf" font-size="10.5">perception.py</text>

  <rect x="190" y="786" width="420" height="120" rx="8" fill="#221739" stroke="#9a6dd7" stroke-width="1.2"/>
