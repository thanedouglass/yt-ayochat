  <text x="764" y="950" fill="#ecc57e" font-size="13" font-weight="700" letter-spacing="1.5">📊 TELEMETRY &amp; EVALUATION</text>

  <rect x="780" y="972" width="380" height="92" rx="8" fill="#2b2210" stroke="#d9a94a" stroke-width="1.2"/>
