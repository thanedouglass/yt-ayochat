  <text x="210" y="358" fill="#f08a8a" font-size="12" font-weight="700" letter-spacing="1.2">🛡 SECURITY &amp; GUARDRAILS</text>

  <rect x="212" y="376" width="176" height="88" rx="8" fill="#2a1216" stroke="#d94a4a" stroke-width="1.2"/>
  <text x="300" y="408" text-anchor="middle" fill="#e8ecf4" font-size="12" font-weight="600">Cloud SDP Sanitizer</text>
  <text x="300" y="428" text-anchor="middle" fill="#f08a8a" font-size="10.5">sdp_sanitizer.py</text>
  <text x="300" y="446" text-anchor="middle" fill="#8b94a7" font-size="10">PII scrubbing</text>

  <rect x="412" y="376" width="176" height="88" rx="8" fill="#2a1216" stroke="#d94a4a" stroke-width="1.2"/>
  <text x="500" y="408" text-anchor="middle" fill="#e8ecf4" font-size="12" font-weight="600">Model Armor</text>
  <text x="500" y="428" text-anchor="middle" fill="#f08a8a" font-size="10.5">model_armor.py</text>
  <text x="500" y="446" text-anchor="middle" fill="#8b94a7" font-size="10">injection screening</text>

  <!-- SDP -> Armor -->
  <line x1="388" y1="420" x2="404" y2="420" stroke="#d94a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

