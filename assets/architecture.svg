  <text x="210" y="998" fill="#e8ecf4" font-size="11.5">Formulates sovereign creator response ·</text>
  <text x="210" y="1016" fill="#e8ecf4" font-size="11.5">code-switch tone · token constraints</text>
  <text x="210" y="1042" fill="#9a8bbf" font-size="10.5">hive.py · dispatcher.py</text>

