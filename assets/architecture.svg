  <text x="174" y="212" fill="#7db8f0" font-size="13" font-weight="700" letter-spacing="1.5">🌐 INGRESS &amp; GATEWAYS</text>

  <rect x="190" y="232" width="420" height="78" rx="8" fill="#122a42" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="400" y="262" text-anchor="middle" fill="#e8ecf4" font-size="13" font-weight="600">YouTube Data API · OAuth 2.0 Listener</text>
  <text x="400" y="284" text-anchor="middle" fill="#7db8f0" font-size="11">src/pipeline/listener.py · auth.py</text>

