  <text x="210" y="838" fill="#e8ecf4" font-size="11.5">Evaluates polarity · selects persona weights ·</text>
  <text x="210" y="856" fill="#e8ecf4" font-size="11.5">arbitrates multi-model orchestration</text>
  <text x="210" y="882" fill="#9a8bbf" font-size="10.5">council.py · supervisor.py</text>

